name: Code and public source audit
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Inspect tracked source and history
        run: |
          python3 scripts/check-public.py --staged
          python3 scripts/check-public.py --history
          mkdir -p .local
          python3 -m unittest discover -s tests -p public_guard_test.py
          python3 -m unittest discover -s tests -p installer_prompt_test.py
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Go tests, vet and vulnerabilities
        env:
          NEKOPASS_TEST_DATABASE_URL: postgres://runner@/nekopass_ci_test?host=/var/run/postgresql&sslmode=disable
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          sudo systemctl start postgresql
          audit_role_exists=$(sudo -u postgres psql -XAt -c "SELECT 1 FROM pg_roles WHERE rolname='runner'")
          if [ "$audit_role_exists" != 1 ]; then
            sudo -u postgres createuser runner
          fi
          sudo -u postgres createdb -O runner nekopass_ci_test
          go test -race -p 1 ./...
          go vet ./...
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            docs/package-lock.json
      - name: Frontend build and dependency audit
        run: |
          npm --prefix web ci
          npm --prefix web run build
          npm --prefix web audit --audit-level=low
      - name: Documentation build and dependency audit
        run: |
          npm --prefix docs ci
          npm --prefix docs run typecheck
          npm --prefix docs run build
          npm --prefix docs audit --audit-level=low
